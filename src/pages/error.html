<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Could not read</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --fg: #111111; --muted: #6b6b6b; --bg: #fcfcfc;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f5; --muted: #9a9a9a; --bg: #111111; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 var(--sans); }
  main { max-width: 34rem; margin: 22vh auto 0; padding: 0 16px; display: grid; gap: 1rem; }
  .home { color: var(--fg); line-height: 0; }
  .mark { height: 2rem; width: auto; margin-left: -.5rem; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
  p { margin: 0; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <a class="home" href="/">{{mark}}</a>
  <h1>Could not read this link</h1>
  <p>{{message}}</p>
  <p><a href="/">Try another link</a></p>
</main>
</body>
</html>
