<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #6b6b6b; --bg: #fdfdfb; --line: #e4e4e0; --code: #f1f1ed; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8e6e1; --muted: #9a978f; --bg: #161615; --line: #2e2d2a; --code: #22211f; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 19px/1.65 Charter, Georgia, serif; }
  article { max-width: 40rem; margin: 0 auto; padding: 2rem 16px 6rem; overflow-wrap: break-word; }
  nav { font-size: .85rem; margin-bottom: 2.5rem; display: flex; justify-content: space-between; gap: 1rem; }
  nav a { color: var(--muted); }
  h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 .5rem; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
  h2, h3 { line-height: 1.3; margin: 2.2rem 0 .6rem; }
  a { color: inherit; text-underline-offset: 3px; }
  img, video { max-width: 100%; height: auto; border-radius: 4px; }
  .cover { display: block; margin-bottom: 2rem; }
  figure { margin: 2rem 0; }
  figcaption { color: var(--muted); font-size: .85rem; }
  blockquote { margin: 1.5rem 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--muted); }
  pre, code { font: .85em/1.5 ui-monospace, Menlo, monospace; background: var(--code); border-radius: 4px; }
  code { padding: .1em .3em; }
  pre { padding: 1rem; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  td, th { border: 1px solid var(--line); padding: .3rem .6rem; }
</style>
</head>
<body>
<article>
  <nav><a href="/">← New link</a><a href="{{source}}">Original</a></nav>
  <h1>{{title}}</h1>
  <p class="meta">{{meta}}</p>
  {{cover}}
  {{content}}
</article>
</body>
</html>
