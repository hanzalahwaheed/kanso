<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{title}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --fg: #111111; --muted: #6b6b6b; --bg: #fcfcfc; --line: #e2e2e2; --code: #f1f1f1;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f5; --muted: #9a9a9a; --bg: #111111; --line: #2c2c2c; --code: #1c1c1c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.7 var(--sans); }
  article { max-width: 40rem; margin: 0 auto; padding: 1.5rem 16px 6rem; overflow-wrap: break-word; }
  nav { font-size: .85rem; margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  nav a { color: var(--muted); }
  nav .home { color: var(--fg); line-height: 0; }
  .mark { height: 1.75rem; width: auto; }
  h1 { font-size: 2.1rem; line-height: 1.2; font-weight: 650; letter-spacing: -.02em; margin: 0 0 .5rem; text-wrap: balance; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 2rem; }
  h2, h3 { line-height: 1.3; font-weight: 600; letter-spacing: -.01em; margin: 2.2rem 0 .6rem; text-wrap: balance; }
  strong, b { font-weight: 600; }
  a { color: inherit; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  img, video { max-width: 100%; height: auto; border-radius: 4px; }
  .cover { display: block; margin-bottom: 2rem; }
  figure { margin: 2rem 0; }
  figcaption { color: var(--muted); font-size: .85rem; }
  blockquote { margin: 1.5rem 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--muted); }
  pre, code { font: .85em/1.5 var(--mono); background: var(--code); border-radius: 4px; }
  code { padding: .1em .3em; }
  pre { padding: 1rem; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  td, th { border: 1px solid var(--line); padding: .3rem .6rem; }
</style>
</head>
<body>
<article>
  <nav><a class="home" href="/" title="New link">{{mark}}</a><a href="{{source}}">Original</a></nav>
  <h1>{{title}}</h1>
  <p class="meta">{{meta}}</p>
  {{cover}}
  {{content}}
</article>
</body>
</html>
