<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanso</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: light dark;
    --fg: #111111; --muted: #6b6b6b; --bg: #fcfcfc; --line: #dcdcdc;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f5; --muted: #9a9a9a; --bg: #111111; --line: #333333; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 var(--sans); }
  main { max-width: 34rem; margin: 22vh auto 0; padding: 0 16px; display: grid; gap: 1.25rem; }
  h1 { margin: 0; line-height: 0; }
  .lockup { height: 2.75rem; width: auto; margin-left: -.45rem; }
  p { color: var(--muted); margin: 0; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; min-width: 0; font: inherit; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  button { font: inherit; font-weight: 500; padding: .6rem 1.1rem; border: 0; border-radius: 6px; background: var(--fg); color: var(--bg); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>{{lockup}}</h1>
  <p>Paste an X post or a blog link. Read only the article.</p>
  <form action="/read" method="get">
    <input id="url" name="url" type="url" placeholder="https://x.com/…/status/…" aria-label="Link to read" required autofocus>
    <button>Read</button>
  </form>
</main>
</body>
</html>
